<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
<!-- Jatify UI icon: the logo knot (the finished frame of the knot animation, icon-knot.png) on the Jatify glow tile, in orange.
     Render: rsvg-convert -w 256 -h 256 package/icon.svg -o package/icon.png (1024 for Discord and GitHub) -->
<defs><radialGradient id="g" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#EC8219" stop-opacity=".28"/><stop offset="1" stop-color="#EC8219" stop-opacity="0"/></radialGradient></defs>
<rect x="8" y="8" width="240" height="240" rx="40" fill="#141416" stroke="#EC8219" stroke-opacity=".33" stroke-width="2"/>
<rect x="9" y="9" width="238" height="238" rx="39" fill="url(#g)"/>
<image x="48" y="48" width="160" height="160" href="icon-knot.png" xlink:href="icon-knot.png"/>
</svg>
